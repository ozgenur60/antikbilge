name: Site checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify local article images
        run: node scripts/check-image-policy.js

      - name: Verify site infrastructure
        run: node scripts/check-site-infrastructure.js
