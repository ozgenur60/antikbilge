name: Apply navigation update

on:
  push:
    branches: ["fix/unify-site-navigation"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/unify-site-navigation
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply HTML fixes
        run: |
          node scripts/unify-navigation.js
          node scripts/fix-afrodit-schema.js

      - name: Verify HTML
        run: |
          node scripts/check-site-navigation.js
          node scripts/check-site-infrastructure.js
          node scripts/check-image-policy.js

      - name: Commit HTML changes
        run: |
          git config user.name "Antik Bilge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- *.html articles/*.html
          git commit -m "Sitedeki tüm kategori menülerini birleştir"
          git push
